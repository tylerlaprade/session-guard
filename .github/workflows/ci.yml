name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: brew install shellcheck
      - run: npm run lint
      - run: npm test
      - run: brew install --cask ghostty iterm2
      - run: /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Ghostty.app /Applications/iTerm.app
      - name: Compile AppleScript
        timeout-minutes: 5
        run: |
          for script in src/app_is_running.applescript src/adapters/*.applescript; do
            osacompile -o "$RUNNER_TEMP/check.scpt" "$script"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy
      - run: cargo test
      - run: cargo build --release
