name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install shellcheck
      - run: curl -fsSL -o "$HOME/.shellcheckrc" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/.shellcheckrc
      - run: shellcheck src/grok_register.sh
      # biome.jsonc extends ../../.config/biome, which is ~/.config/biome for a checkout at ~/Code/<repo>.
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/../../.config/biome"
          curl -fsSL -o "$GITHUB_WORKSPACE/../../.config/biome/biome.jsonc" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/.config/biome/biome.jsonc
      # Biome resolves the OpenCode plugin's solid-js import, which OpenCode supplies at run time, from node_modules.
      - run: npm ci
      - run: npx --yes @biomejs/biome@2.6.4 check --error-on-warnings
      - run: brew install --cask ghostty iterm2
      - run: /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Ghostty.app /Applications/iTerm.app
      - name: Compile AppleScript
        timeout-minutes: 5
        run: |
          for script in src/app_is_running.applescript src/adapters/*.applescript; do
            osacompile -o "$RUNNER_TEMP/check.scpt" "$script"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: curl -fsSL -o "$HOME/.rustfmt.toml" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/.rustfmt.toml
      - run: cargo fmt --check
      - run: cargo check
      - run: curl -fsSL -o "$RUNNER_TEMP/cargo-clippy.py" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/scripts/cargo-clippy.py
      - run: python3 "$RUNNER_TEMP/cargo-clippy.py" clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
